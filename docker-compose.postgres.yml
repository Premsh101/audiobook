services:
  postgres:
    image: postgres:17-alpine
    container_name: hush-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hush}
      POSTGRES_USER: ${POSTGRES_USER:-hush}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - hush_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hush} -d ${POSTGRES_DB:-hush}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hush_postgres_data:
